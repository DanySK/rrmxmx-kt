name: Actualize Yarn Lock
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  update-ancillary-files:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: '0'
      - uses: DanySK/build-check-deploy-gradle-action@4.0.52
        with:
          build-command: |
            ./gradlew kotlinUpgradeYarnLock --parallel
          check-command: true
          should-run-codecov: false
          should-deploy: false
      # Goes through the merge queue like any other change.
      # Uses a personal token: pull requests opened with GITHUB_TOKEN do not trigger the CI.
      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ secrets.DEPLOYMENT_TOKEN }}
          branch: ancillary/actualize-yarn-lock
          delete-branch: true
          add-paths: kotlin-js-store/yarn.lock
          commit-message: 'chore(build): actualize the `yarn.lock` file'
          committer: 'Danilo Pianini [bot] <danilo.pianini@gmail.com>'
          author: 'Danilo Pianini [bot] <danilo.pianini@gmail.com>'
          title: 'chore(build): actualize the `yarn.lock` file'
          body: Automatic update of `kotlin-js-store/yarn.lock` after the last changes on `master`.
          labels: ancillary
